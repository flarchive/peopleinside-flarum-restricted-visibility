      warn_no_private: "Attenzione: non hai il permesso di rendere privato un contenuto già esistente. Una volta pubblicato o salvato come pubblico non potrai più limitarne la visibilità: dovrà farlo chi ha quel permesso."
      warn_no_edit_after: "Attenzione: non hai il permesso di modificare la visibilità di contenuti già pubblicati. Dopo la pubblicazione non potrai più cambiare gruppi o utenti scelti: potrai solo renderlo pubblico (se hai quel permesso) e poi non potrai più limitarlo."
      save: "Applica"
  admin:
    permissions:
      create_private: "Creare nuovi post e discussioni privati"
      restrict: "Rendere privati i post e le discussioni già esistenti (restringere la visibilità)"
      make_public: "Rendere pubblici i propri post e discussioni (togliere la restrizione)"
      view_all: "Vedere tutti i contenuti riservati"
    button_position:
      label: "Posizione del pulsante nel composer"
      help: "Dove compare il pulsante \"Chi può vederlo?\" rispetto ai pulsanti Pubblica e Anteprima."
      before_submit: "Prima del pulsante Pubblica"
      after_submit: "Dopo il pulsante Pubblica (predefinito)"
      after_preview: "Dopo il pulsante Anteprima"
    danger:
      title: "Zona pericolosa"
      help: "Elimina tutte le restrizioni di visibilità, i permessi e le impostazioni di questa estensione. Fallo PRIMA di disattivarla o rimuoverla."
      button: "Elimina tutti i dati dell'estensione…"
    purge:
      title: "Elimina tutti i dati dell'estensione"
      summary: "{discussions} discussioni e {posts} post sono riservati ({groups} collegamenti a gruppi, {users} a utenti)."
      choose: "Cosa fare dei contenuti riservati?"
      mode_hide: "Nascondi (consigliato)"
      mode_hide_help: "Li marca come nascosti: solo i moderatori potranno vederli. Non si perde nulla."
      mode_delete: "Elimina definitivamente"
      mode_delete_help: "Cancella per sempre i post e le discussioni riservate."
      mode_public: "Rendi pubblici"
      mode_public_help: "Rimuove solo le restrizioni: tutti vedranno questi contenuti."
      warning: "Questa operazione è irreversibile. Verranno eliminate tutte le restrizioni, i permessi e le impostazioni dell'estensione. Se non scegli di nascondere o eliminare i contenuti riservati, diventeranno visibili a tutti. Fai prima un backup del database. Poi disattiva l'estensione: non proteggerà nulla finché non reimposti le restrizioni."
      type_to_confirm: "Digita {word} per continuare"
      run: "Elimina i dati"
      done: "Fatto. Discussioni interessate: {discussions}, post interessati: {posts}."
      queued: "Operazione messa in coda ed eseguita in background. NON disattivare l'estensione finché non è terminata (controlla il worker della coda / i log)."
