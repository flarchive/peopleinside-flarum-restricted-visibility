peopleinside-restricted-visibility:
  forum:
    badge:
      discussion: "Discussione riservata"
      posts: "{count, plural, one {# messaggio riservato} other {# messaggi riservati}}"
    post:
      restricted: "Riservato"
      restricted_to: "Riservato a: {names}"
      discussion_restricted_to: "Discussione riservata a: {names}"
      discussion_restricted: "Discussione riservata"
      limited_by_discussion: "Messaggio pubblico, ma limitato dalla visibilità della discussione. Se la discussione torna pubblica, questo messaggio sarà visibile a tutti."
    composer:
      button: "Chi può vederlo?"
    controls:
      restrict: "Modifica visibilità…"
    modal:
      title: "Chi può vederlo?"
      everyone: "Tutti quelli che già vedono la discussione"
      only_some: "Solo gruppi o utenti scelti"
      groups: "Gruppi"
      users: "Utenti"
      search_placeholder: "Cerca un utente…"
      help: "Tu e i moderatori lo vedrete sempre. Chi non può vederlo non riceve né notifica né email. Puoi scegliere solo tra chi già vede la discussione: non puoi dare accesso a chi non potrebbe vederla."
      empty_error: "Scegli almeno un gruppo o un utente, oppure seleziona \"Tutti\"."
      orphaned: "I gruppi o gli utenti a cui era riservato sono stati rimossi: ora lo vedono solo l'autore, i moderatori e gli amministratori. Scegli chi può vederlo, oppure seleziona \"Tutti\" per renderlo pubblico."
      no_permission_public: "Non hai il permesso di rendere di nuovo pubblico questo contenuto."
